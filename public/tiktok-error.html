<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No se pudo conectar TikTok · Juancito Ads</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <!-- Página estática, sin scripts: a ella vuelve el CLIENTE después de
       conectar su TikTok desde el enlace que le mandó la agencia. No
       tiene sesión, y no debe ver nada de la aplicación. -->
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #050D1F; color: #EAF0F8;
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 440px; padding: 32px 24px; text-align: center; }
    img { width: 64px; height: 64px; }
    h1 { font-size: 1.4rem; line-height: 1.3; margin: 16px 0 8px; }
    p { color: #C9D6E6; margin: 0; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="Juancito Ads">
    <h1>No se pudo conectar TikTok</h1>
    <p>El enlace caducó o se canceló el permiso. Pídele a la agencia un enlace nuevo y vuelve a intentarlo.</p>
  </main>
</body>
</html>
