[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--prefer-offline"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"

# ------------------------------------------------------------
# Redirecciones
# El orden importa: Netlify procesa de arriba abajo y gana la primera
# coincidencia, así que el respaldo de la SPA va SIEMPRE el último.
# ------------------------------------------------------------

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ------------------------------------------------------------
# Cabeceras de seguridad
# ------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    # Política de seguridad de contenido.
    #   'unsafe-inline' en style-src es necesario: React aplica estilos
    #   mediante la prop `style`, que genera atributos en línea.
    #   script-src NO lo lleva: Vite emite módulos externos, así que un
    #   <script> inyectado no se ejecutaría.
    #   connect-src ya NO incluye a Anthropic, Groq ni GitHub: el
    #   navegador no los llama, lo hacen las funciones del servidor. Si
    #   alguna vez reaparecen aquí, es que una clave volvió al front.
    #   wss://*.supabase.co es necesario para las aprobaciones en vivo.
    Content-Security-Policy = """
      default-src 'self'; \
      script-src 'self'; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
      font-src 'self' https://fonts.gstatic.com; \
      img-src 'self' data: blob: https:; \
      connect-src 'self' https://*.supabase.co wss://*.supabase.co; \
      frame-ancestors 'none'; \
      base-uri 'self'; \
      form-action 'self'; \
      object-src 'none'"""

# El endpoint de aprobación no debe cachearse nunca: devuelve el estado
# de revisión en vivo.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

# Los recursos con hash de contenido en el nombre son inmutables.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
