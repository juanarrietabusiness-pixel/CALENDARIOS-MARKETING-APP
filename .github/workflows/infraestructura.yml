# Comprueba la infraestructura que hay desplegada de verdad.
#
# `npm test` lee el repositorio: dice si el código está bien escrito, no
# si lo que corre en producción es ese código. La deriva —un Worker
# subido a mano que no está en ningún commit, una migración escrita y
# sin aplicar, una cabecera que se quedó en el fichero y no llegó al
# borde— sólo se ve mirando el sitio.
#
# No va en CI porque necesita llaves y porque no tiene sentido pedírselas
# a cada pull request. Corre cada mañana y cuando alguien lo lanza.
#
#   SITIO_URL              la dirección del sitio publicado
#   CLOUDFLARE_API_TOKEN   opcional, para mirar la cuenta
#   CLOUDFLARE_ACCOUNT_ID  opcional, idem
name: Infraestructura

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:infra
        env:
          SITIO_URL: ${{ secrets.SITIO_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
