# Despliega las Edge Functions de Supabase al mergear a main.
#
# Existe porque el despliegue manual se quedó sin hacer durante horas y el
# fallo se veía igual que un repositorio mal escrito: la función vieja
# recorta el ADN, la aplicación cae al compilador de IA y faltan campos.
# Nadie tiene por qué acordarse de esto, y no todo el mundo tiene un clon
# local desde el que ejecutarlo.
#
# HACE FALTA UN SECRETO, una sola vez:
#   SUPABASE_ACCESS_TOKEN — se genera en
#   https://supabase.com/dashboard/account/tokens
#   y se pega en Settings → Secrets and variables → Actions del repositorio.
#
# El identificador del proyecto no es un secreto: va en la URL del panel y
# ya está en DEPLOY.md.
name: Desplegar funciones

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/desplegar-funciones.yml"
  workflow_dispatch:

env:
  PROJECT_REF: lwkepnrprcyabyhhorrc

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que hay token
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN."
            echo "Genéralo en https://supabase.com/dashboard/account/tokens"
            echo "y añádelo en Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Desplegar ai
        run: supabase functions deploy ai --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Desplegar github-adn
        run: supabase functions deploy github-adn --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Desplegar image-gen
        run: supabase functions deploy image-gen --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
