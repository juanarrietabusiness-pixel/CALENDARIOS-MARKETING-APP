# Lint, tests y build en cada push y cada pull request.
#
# Existe porque esta semana se mergeó un arreglo a medias y el fallo se
# descubrió en una captura de pantalla del cliente. Un PR que no pase esto
# no debería llegar a main —y desde que main está protegida, no puede—.
#
# El nombre del job («verificar») es el que exige el ruleset de la rama:
# si se renombra aquí, hay que renombrarlo allí o la protección deja de
# comprobar nada. Lo mismo al revés.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre el mismo PR cancela la ejecución anterior: no tiene
# sentido gastar minutos verificando un commit que ya no es la cabeza.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # La misma versión con la que se construye para desplegar.
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # `npm run build` a secas vuelve a ser suficiente. Con Supabase hacía
      # falta construir con las VITE_* puestas o Vite plegaba
      # `isSupabaseEnabled` a false y rollup borraba el panel entero del
      # bundle: el build pasaba sin haber compilado media aplicación. Ya no
      # hay ninguna variable de la que dependa qué se compila.
      - name: Construir
        run: npm run build

      # Sobre el dist recién construido: presupuesto de descarga y caché.
      - name: Tests de bundle
        run: npm run test:bundle

      # El tiempo real, EJECUTADO: levanta `wrangler dev` —workerd de
      # verdad, con su D1 y su Durable Object—, mete a dos personas en un
      # espacio y comprueba que lo que escribe una llega al socket de la
      # otra. No necesita llaves ni cuenta de Cloudflare: corre en local.
      #
      # Va aquí y no en `npm test` porque arranca un proceso. Pero va en
      # CI, no sólo a mano: los demás casos del tiempo real comprueban que
      # el evento está ESCRITO, y que esté escrito no es que llegue.
      - name: Tests de tiempo real
        run: npm run test:vivo

      # El informe se escribe siempre, y se sube incluso si algo falló:
      # es lo que se lee para corregir sin volver a auditar el repositorio.
      - name: Subir el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-despliegue
          path: informe-despliegue.md
          if-no-files-found: ignore

  # ------------------------------------------------------------
  # Comentario en el PR cuando algo falla.
  #
  # Va en un job aparte con permiso de escritura, para que el job que
  # ejecuta el código del PR siga siendo de sólo lectura.
  # ------------------------------------------------------------
  informar:
    needs: verificar
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: informe-despliegue
        continue-on-error: true

      - name: Comentar el informe en el PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let cuerpo;
            try {
              cuerpo = fs.readFileSync('informe-despliegue.md', 'utf8');
            } catch {
              cuerpo = 'La verificación falló antes de poder escribir el informe. ' +
                       'Mira el registro del job «verificar».';
            }
            // GitHub corta los comentarios a 65 536 caracteres.
            const MAX = 60000;
            if (cuerpo.length > MAX) {
              cuerpo = cuerpo.slice(0, MAX) +
                '\n\n…(recortado; el informe completo está en los artefactos del job)';
            }
            const marca = '<!-- informe-despliegue -->';
            const texto = `${marca}\n${cuerpo}`;

            // Se edita el comentario anterior en vez de apilar uno nuevo
            // por intento: el hilo del PR queda con el estado de ahora,
            // no con el historial de todos los fallos.
            const { data: comentarios } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const mio = comentarios.find((c) => c.body.includes(marca));
            if (mio) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: mio.id,
                body: texto,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: texto,
              });
            }
