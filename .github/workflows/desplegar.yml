# Despliegue a Cloudflare.
#
# POR QUÉ NO SE CONECTA CLOUDFLARE DIRECTAMENTE AL REPOSITORIO
#
# La integración de Cloudflare con Git construye y publica en cada push
# SIN pasar por los tests de este repositorio. Con eso, un merge a medias
# —o un push directo— llega a producción sin que nada lo pare, y el fallo
# se descubre en una captura de pantalla del cliente.
#
# Por eso el despliegue vive aquí: el job corre `npm run verificar`
# ENTERO antes de publicar nada, y si algo falla no se despliega. El
# filtro no está en otro workflow del que éste dependa, está dentro del
# mismo job: así no hay forma de saltárselo.
name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desplegar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Comprobar que hay credenciales
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          falta=""
          [ -z "$TOKEN" ]  && falta="$falta CLOUDFLARE_API_TOKEN"
          [ -z "$CUENTA" ] && falta="$falta CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$falta" ]; then
            echo "Faltan secretos del repositorio:$falta"
            echo "Se ponen en Settings → Secrets and variables → Actions."
            echo "El procedimiento completo está en DEPLOY.md."
            exit 1
          fi

      # EL FILTRO. Lint + tests + build + presupuesto de bundle, lo mismo
      # que exige la protección de main. Si esto falla, no se publica.
      - name: Verificar
        run: npm run verificar

      # Las migraciones van ANTES que el código. Al revés, el Worker
      # nuevo pide columnas que la base todavía no tiene.
      - name: Aplicar migraciones de D1
        run: npx wrangler d1 migrations apply calendarios-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Desplegar el Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Dónde quedó
        run: |
          echo "### Desplegado" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`${GITHUB_SHA::7}\` publicado tras pasar \`verificar\`." >> "$GITHUB_STEP_SUMMARY"
